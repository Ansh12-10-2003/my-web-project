apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-custom-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-custom-app
  template:
    metadata:
      labels:
        app: my-custom-app
    spec:
      containers:
        - name: custom-app-container
          image: my-custom-app:v2
          imagePullPolicy: Never
          ports:
          - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-custom-app-service
spec:
  type: NodePort
  selector:
    app: my-custom-app
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
